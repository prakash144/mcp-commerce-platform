server:
  port: 8082

logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true    # serves the raw merged schema at /graphql/schema.graphqls

commerce:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  payment-service:
    target: ${PAYMENT_SERVICE_TARGET:localhost:50051}
  order:
    # Identity fallback used when the gateway (X-User-Id header) is absent — local dev via curl.
    default-customer-id: ${DEFAULT_CUSTOMER_ID:22222222-2222-2222-2222-222222222222}
    retry:
      # How often the PENDING-order retry job polls for due orders.
      poll-interval: ${ORDER_RETRY_POLL_INTERVAL:15s}
      # Delay before the first poll after startup.
      initial-delay: ${ORDER_RETRY_INITIAL_DELAY:15s}
      # Max orders picked up per poll.
      poll-batch-size: ${ORDER_RETRY_POLL_BATCH:20}
      # Exponential retry backoff after each failed charge attempt.
      initial-backoff: ${ORDER_RETRY_INITIAL_BACKOFF:30s}
      # Ceiling for the exponential backoff.
      max-backoff: ${ORDER_RETRY_MAX_BACKOFF:15m}
      # Total charge attempts before a PENDING order is marked FAILED.
      max-attempts: ${ORDER_RETRY_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
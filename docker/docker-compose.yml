networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  # ─── Postgres (single instance, multiple databases — dev pragmatism) ───
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks:
      - backend
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
      POSTGRES_MULTIPLE_DATABASES: productdb,orderdb,paymentdb,keycloakdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    hostname: redis
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka ───
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6
    hostname: zookeeper
    networks:
      - backend
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-server:7.6
    hostname: kafka
    networks:
      - backend
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6
    hostname: schema-registry
    networks:
      - backend
    ports:
      - "8089:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  # ─── Keycloak (bridges frontend + backend) ───
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    hostname: keycloak
    networks:
      frontend:
        aliases:
          - keycloak
      backend:
        aliases:
          - keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: commerce
      KC_DB_PASSWORD: commerce_pass
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Kong (API Gateway, DB-less mode bridges frontend + backend) ───
  kong:
    image: kong:3.8-alpine
    hostname: kong
    networks:
      frontend:
        aliases:
          - kong
      backend:
        aliases:
          - kong
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong-config.yml:/etc/kong/kong.yml
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

# ─── Application services (built from source — one container per service) ───
  # Each app container has its own log stream (docker compose logs -f <service>)
  # and healthcheck. Own images: product-service/Dockerfile, order-service/Dockerfile,
  # payment-service/Dockerfile, web/Dockerfile.

  product-service:
    build:
      context: ../product-service
      dockerfile: Dockerfile
    hostname: product-service
    networks:
      - backend
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      DB_USERNAME: commerce
      DB_PASSWORD: commerce_pass
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    hostname: order-service
    networks:
      - backend
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: commerce
      DB_PASSWORD: commerce_pass
      PRODUCT_SERVICE_URL: http://product-service:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    hostname: payment-service
    networks:
      - backend
    ports:
      - "50051:50051"
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRPC_PORT: "50051"
      REST_PORT: "8090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: commerce
      DB_PASSWORD: commerce_pass
      DB_NAME: paymentdb
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    hostname: web
    networks:
      - backend
    ports:
      - "5173:5173"
    environment:
      WEB_PROXY_PRODUCT: http://product-service:8081
      WEB_PROXY_ORDER: http://order-service:8082
      WEB_PROXY_PAYMENT: http://payment-service:8090
    volumes:
      - ../web:/app
      - /app/node_modules
    command: sh -c "test -d node_modules && test -s node_modules/.package-lock.json || npm install --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:

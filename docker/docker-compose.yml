networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# Log shipping: the loki Docker logging plugin (grafana/loki-docker-driver,
# install once per host: docker plugin install ... --alias loki) streams each
# container's logs to the loki service. keep-file preserves `docker compose logs`.
# label `svc` is set per-service so Grafana can filter by it. Loki label names
# cannot contain dots — that's why it is `svc`, not `platform.service`.
# NOTE: the plugin runs on the Docker HOST (not in a container network), so it
# must reach Loki via the host-published port localhost:3100 — not the
# container DNS name `loki`.
x-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    labels: "svc"
    keep-file: "true"
    loki-batch-size: "400"
    loki-retries: "5"
    max-size: "10m"

services:
  # ─── Postgres (single instance, multiple databases — dev pragmatism) ───
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks:
      - backend
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_pass
      POSTGRES_MULTIPLE_DATABASES: productdb,orderdb,paymentdb,keycloakdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    hostname: redis
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (KRaft — no ZooKeeper; combined controller+broker single node) ───
  # KRaft stores cluster metadata in the broker's own Raft quorum, so there is no
  # separate ZK quorum to run/operate. Tradeoff: newer model (Kafka >= 3.3;
  # the 2026 default) — some legacy tooling/tutorials still assume ZK.
  kafka:
    image: confluentinc/cp-server:7.6.14
    hostname: kafka
    networks:
      - backend
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.14
    hostname: schema-registry
    networks:
      - backend
    ports:
      - "8089:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  # ─── Kafka UI (provectus) — browse topics, consumer groups, schema registry ───
  kafka-ui:
    image: provectus/kafka-ui:latest
    hostname: kafka-ui
    labels:
      svc: kafka-ui
    logging: *loki-logging
    networks:
      - backend
    ports:
      - "8086:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRYURL: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Observability: Loki (log store) + Grafana (UI) ───
  loki:
    image: grafana/loki:3.4.2
    hostname: loki
    networks:
      - backend
    ports:
      - "3100:3100"   # LogQL API (logs from the driver + debugging from host)
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.2
    hostname: grafana
    networks:
      - backend
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.2
    hostname: prometheus
    networks:
      - backend
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Keycloak (bridges frontend + backend) ───
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    hostname: keycloak
    labels:
      svc: keycloak
    logging: *loki-logging
    networks:
      frontend:
        aliases:
          - keycloak
      backend:
        aliases:
          - keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: commerce
      KC_DB_PASSWORD: commerce_pass
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Kong (API Gateway, DB-less mode bridges frontend + backend) ───
  kong:
    image: kong:3.8-alpine
    hostname: kong
    labels:
      svc: kong
    logging: *loki-logging
    networks:
      frontend:
        aliases:
          - kong
      backend:
        aliases:
          - kong
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong-config.yml:/etc/kong/kong.yml
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

# ─── Application services (built from source — one container per service) ───
  # Each app container has its own log stream (docker compose logs -f <service>)
  # and healthcheck. Own images: product-service/Dockerfile, order-service/Dockerfile,
  # payment-service/Dockerfile, web/Dockerfile.

  product-service:
    build:
      context: ../product-service
      dockerfile: Dockerfile
    hostname: product-service
    labels:
      svc: product-service
    logging: *loki-logging
    networks:
      - backend
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      DB_USERNAME: commerce
      DB_PASSWORD: commerce_pass
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    hostname: order-service
    labels:
      svc: order-service
    logging: *loki-logging
    networks:
      - backend
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: commerce
      DB_PASSWORD: commerce_pass
      PRODUCT_SERVICE_URL: http://product-service:8081
      PAYMENT_SERVICE_TARGET: payment-service:50051
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    hostname: payment-service
    labels:
      svc: payment-service
    logging: *loki-logging
    networks:
      - backend
    ports:
      - "50051:50051"
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      GRPC_PORT: "50051"
      REST_PORT: "8090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: commerce
      DB_PASSWORD: commerce_pass
      DB_NAME: paymentdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    hostname: web
    labels:
      svc: web
    logging: *loki-logging
    networks:
      - backend
    ports:
      - "5173:5173"
    environment:
      WEB_PROXY_PRODUCT: http://product-service:8081
      WEB_PROXY_ORDER: http://order-service:8082
      WEB_PROXY_PAYMENT: http://payment-service:8090
    volumes:
      - ../web:/app
      - /app/node_modules
    command: sh -c "test -d node_modules && test -s node_modules/.package-lock.json || npm install --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  loki-data:
  grafana-data:
